<!doctype html><html><head><meta charset="utf-8"><title>maplab harness</title>
<style>html,body{margin:0;width:1440px;height:1000px;overflow:hidden;background:#060a0d;color:#eae5da;font:12px -apple-system,sans-serif}
#out{position:fixed;right:0;top:0;width:420px;height:100%;background:#000;font:10px Menlo;white-space:pre-wrap;padding:6px;box-sizing:border-box;overflow:auto;z-index:99}
</style></head><body>
<script src="../assets/data/maps.js"></script>
<script>var M=VD_MAPS.maps["ascent"];</script>
<script>
(function(){
  var m=M, g=m.grid, res={slug:m.slug};
  function blockedWorld(x,y){var px=(x-m.x0)/m.s+m.dx, py=(m.y0-y)/m.s+m.dy;
    var c=Math.floor(px/m.size[0]*g.w), r=Math.floor(py/m.size[1]*g.h);
    if(r<0||c<0||r>=g.h||c>=g.w) return true;
    return g.rows[r].charCodeAt(c)===49;}
  // 1) 点位落点检查：所有「已标定」点位在网格里应处于可走格
  var okSum=0, pts=m.callouts.filter(function(c){return !c.o;});
  pts.forEach(function(c){ var x=m.x0+(c.u*m.size[0]-m.dx)*m.s, y=m.y0-(c.v*m.size[1]-m.dy)*m.s; if(!blockedWorld(x,y)) okSum++; });
  res.ptsInWalkable = okSum+'/'+pts.length;
  // 2) 可走格连通性：从最大连通块出发，统计占比（孤立小房间说明网格有洞）
  var W=g.w,H=g.h,seen=new Uint8Array(W*H), best=0, sizes=[];
  for(var y0=0;y0<H;y0++) for(var x0=0;x0<W;x0++){
    var i=y0*W+x0; if(seen[i]||g.rows[y0][x0]==='1') continue;
    var st=[[x0,y0]], n=0; seen[i]=1;
    while(st.length){var p=st.pop(); n++; var x=p[0],y=p[1];
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d2){var nx=x+d2[0], ny=y+d2[1];
        if(nx<0||ny<0||nx>=W||ny>=H) return; var j=ny*W+nx;
        if(seen[j]||g.rows[ny][nx]==='1') return; seen[j]=1; st.push([nx,ny]);});}
    sizes.push(n); if(n>best) best=n;
  }
  sizes.sort(function(a,b){return b-a;});
  var walk=0; g.rows.forEach(function(r){for(var i=0;i<r.length;i++) if(r[i]==='0') walk++;});
  res.walkable=walk; res.biggest=sizes[0]||0; res.components=sizes.length;
  res.biggestPct=(best/walk*100).toFixed(1)+'%';
  window.__R=(window.__R||[]); window.__R.push(res);
})();
</script>
